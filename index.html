<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Projetos</title>
<meta name="description" content="Índice de acesso rápido aos projetos do time.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231b2410'/><text x='16' y='23' font-size='19' font-family='sans-serif' font-weight='700' fill='%23c6f24a' text-anchor='middle'>X</text></svg>">
<style>
  :root{
    --bg:#f6f7f3;
    --surface:#ffffff;
    --border:#e6e9e0;
    --border-strong:#d3dac6;
    --ink:#16200f;
    --ink-soft:#6b7563;
    --lime:#c6f24a;
    --lime-soft:#e9f7cf;
    --lime-btn:#d3ef94;
    --lime-btn-hover:#c6e97c;
    --icon-ink:#3f5c1f;
    --focus:#4d7c0f;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Helvetica Neue",sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    border-top:3px solid var(--lime);
  }
  .topbar__inner{
    max-width:1160px;
    margin:0 auto;
    padding:16px 24px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo{
    width:28px;height:28px;flex:0 0 28px;
    border-radius:8px;
    background:#1b2410;
    color:var(--lime);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;line-height:1;
  }
  .brand{font-size:16px;font-weight:600;letter-spacing:-0.01em}

  main{
    max-width:1160px;
    margin:0 auto;
    padding:32px 24px 64px;
  }
  .page-title{
    margin:0 0 4px;
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .page-sub{
    margin:0 0 24px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
    gap:16px;
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    min-width:0;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .card:hover{
    border-color:var(--border-strong);
    box-shadow:0 6px 18px rgba(22,32,15,.07);
    transform:translateY(-2px);
  }
  .card:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:3px;
  }

  .card__icon{
    width:44px;height:44px;
    border-radius:12px;
    background:var(--lime-soft);
    color:var(--icon-ink);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .card__icon svg{width:22px;height:22px;display:block}

  .card__title{
    font-size:16px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    align-self:stretch;
    min-width:0;
    overflow-wrap:anywhere;
  }
  .card__meta{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
    align-self:stretch;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .card__cta{
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--lime-btn);
    color:#24310f;
    font-size:13px;
    font-weight:600;
    padding:7px 14px;
    border-radius:8px;
    transition:background .15s ease;
  }
  .card:hover .card__cta{background:var(--lime-btn-hover)}

  .footnote{
    margin:32px 0 0;
    font-size:12px;
    color:var(--ink-soft);
  }

  @media (max-width:520px){
    .topbar__inner{padding:14px 16px}
    main{padding:24px 16px 48px}
    .grid{grid-template-columns:1fr;gap:12px}
    .card{padding:18px}
  }

  @media (prefers-reduced-motion:reduce){
    .card,.card__cta{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <span class="logo" aria-hidden="true">X</span>
    <span class="brand">Central de Projetos</span>
  </div>
</header>

<main>
  <h1 class="page-title">Projetos</h1>
  <p class="page-sub">4 projetos no ar. Escolha um para abrir.</p>

  <div class="grid" id="grid"></div>

  <noscript>
    <p class="footnote">Ative o JavaScript para carregar a lista de projetos.</p>
  </noscript>

  <p class="footnote">Os links abrem em uma nova aba.</p>
</main>

<script>
  /* ------------------------------------------------------------------
     ÚNICA FONTE DE VERDADE DA LISTA (RF-07).
     Para adicionar, remover ou editar um projeto, mexa só aqui.
     `icon` aceita: calendar | book | quote | archive
     ------------------------------------------------------------------ */
  const PROJETOS = [
    {
      nome: 'Agendamentos de calls',
      url: 'https://mvpa-gendamento-call-com-especialista-5sivyj44n-fluu1.vercel.app/calls',
      icon: 'calendar'
    },
    {
      nome: 'Biblioteca do Acdemy',
      url: 'https://transcricoes-academy.vercel.app/',
      icon: 'book'
    },
    {
      nome: 'Central de depoimentos',
      url: 'https://depoimentos-five.vercel.app/',
      icon: 'quote'
    },
    {
      nome: 'Acervo do Fluxo',
      url: 'https://acervo-do-fluxo.vercel.app/referencias',
      icon: 'archive'
    }
  ];

  const ICONS = {
    calendar: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>',
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>',
    quote: '<path d="M10 11H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v8a4 4 0 0 1-4 4M20 11h-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v8a4 4 0 0 1-4 4"/>',
    archive: '<path d="M3 4h18v4H3zM5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>'
  };

  function svg(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
           (ICONS[name] || ICONS.archive) + '</svg>';
  }

  function dominio(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return ''; }
  }

  const grid = document.getElementById('grid');

  PROJETOS.forEach(function (p) {
    // Link HTML real (RF-05): permite "abrir em nova aba" e "copiar link" do navegador.
    const a = document.createElement('a');
    a.className = 'card';
    a.href = p.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    const icon = document.createElement('span');
    icon.className = 'card__icon';
    icon.innerHTML = svg(p.icon);

    const titulo = document.createElement('span');
    titulo.className = 'card__title';
    titulo.textContent = p.nome;

    const meta = document.createElement('span');
    meta.className = 'card__meta';
    meta.textContent = dominio(p.url);

    const cta = document.createElement('span');
    cta.className = 'card__cta';
    cta.innerHTML = 'Abrir <span aria-hidden="true">&rarr;</span>';

    a.append(icon, titulo, meta, cta);
    grid.appendChild(a);
  });
</script>

</body>
</html>
